name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1
  GODOT_TAG: 4.4.1-stable
  # Never let Gradle spawn a background daemon on CI - the daemon keeps the
  # output pipe open and GitHub Actions waits forever (6h timeout hang).
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and export templates
        run: |
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz
          unzip -q Godot_v${GODOT_TAG}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_TAG}_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_TAG}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Configure Android SDK for Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.4.tres
          cat ~/.config/godot/editor_settings-4.4.tres
          ls "${ANDROID_SDK_ROOT}/build-tools"

      - name: Import project
        run: godot --headless --path . --import 2>&1 | tee import.log; ! grep -E "SCRIPT ERROR|Parse Error" import.log

      - name: Smoke test (practice match vs bots)
        run: |
          chmod +x tests/run_tests.sh
          tests/run_tests.sh practice 150 | tee test.log
          grep -q "DONE practice" test.log
          ! grep -E "SCRIPT ERROR" test.log

      - name: Install Android build template (needed for the Gradle build)
        run: |
          godot --headless --path . --install-android-build-template
          # Double safety: disable the Gradle daemon in the project too.
          echo "org.gradle.daemon=false" >> android/build/gradle.properties

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "RELEASE_KEYSTORE=/tmp/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_USER=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret - generating a debug keystore (installable for testing)."
            keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mini Fire Debug, OU=Dev, O=MiniFire, L=Tehran, C=IR"
            echo "RELEASE_KEYSTORE=/tmp/debug.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASS=android" >> "$GITHUB_ENV"
          fi

      - name: Firebase check
        run: |
          if [ -f android/build/google-services.json ]; then
            echo "google-services.json found - Google Sign-In and cloud saves will be included in this build."
          else
            echo "No google-services.json - building WITHOUT Firebase. Add it at android/build/google-services.json (Firebase console > Android app) to enable Google Sign-In and cloud saves."
          fi

      - name: Cache Gradle dependencies (speeds up every build after the first)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-deps-v1
          restore-keys: gradle-deps-

      - name: Export release APK
        env:
          RELEASE_KEYSTORE: ${{ env.RELEASE_KEYSTORE }}
        run: |
          mkdir -p export
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RELEASE_KEYSTORE"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$RELEASE_KEYSTORE_USER"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$RELEASE_KEYSTORE_PASS"
          # 60-minute cap: first build downloads ~2GB of deps on a slow runner.
          timeout 60m godot --headless --path . --export-release "Android" export/MiniFire.apk 2>&1 | tee export.log
          test -f export/MiniFire.apk
          ls -la export
          "${ANDROID_SDK_ROOT}"/build-tools/$(ls "${ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -1)/apksigner verify --print-certs export/MiniFire.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: MiniFire-apk
          path: export/MiniFire.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mini Fire build ${{ github.run_number }}
          files: export/MiniFire.apk
