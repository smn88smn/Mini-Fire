name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1
  GODOT_TAG: 4.4.1-stable

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and export templates
        run: |
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz
          unzip -q Godot_v${GODOT_TAG}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_TAG}_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_TAG}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Configure Android SDK for Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.4.tres
          cat ~/.config/godot/editor_settings-4.4.tres
          ls "${ANDROID_SDK_ROOT}/build-tools"

      - name: Import project
        run: godot --headless --path . --import 2>&1 | tee import.log; ! grep -E "SCRIPT ERROR|Parse Error" import.log

      - name: Smoke test (practice match vs bots)
        run: |
          chmod +x tests/run_tests.sh
          tests/run_tests.sh practice 150 | tee test.log
          grep -q "DONE practice" test.log
          ! grep -E "SCRIPT ERROR" test.log

      - name: Prepare signing key (or fall back to debug signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "RELEASE_KEYSTORE=/tmp/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret - Godot will sign with its debug key (installable for testing)."
          fi

      - name: Enable Firebase (only when google-services.json is present)
        run: |
          if [ -f android/build/google-services.json ]; then
            echo "google-services.json found - building with Gradle so Firebase (Google Sign-In + cloud save) is included."
            sed -i 's|^gradle_build/use_gradle_build=false|gradle_build/use_gradle_build=true|' export_presets.cfg
            grep gradle_build/use_gradle_build export_presets.cfg
          else
            echo "No google-services.json - building without Firebase. Add it at android/build/google-services.json to enable Google Sign-In and cloud saves."
          fi

      - name: Export release APK
        env:
          RELEASE_KEYSTORE: ${{ env.RELEASE_KEYSTORE }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p export
          if [ -n "$RELEASE_KEYSTORE" ]; then
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RELEASE_KEYSTORE"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEYSTORE_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEYSTORE_PASSWORD"
          fi
          godot --headless --path . --export-release "Android" export/MiniFire.apk 2>&1 | tee export.log
          test -f export/MiniFire.apk
          ls -la export
          "${ANDROID_SDK_ROOT}"/build-tools/$(ls "${ANDROID_SDK_ROOT}/build-tools" | sort -V | tail -1)/apksigner verify --print-certs export/MiniFire.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: MiniFire-apk
          path: export/MiniFire.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mini Fire build ${{ github.run_number }}
          files: export/MiniFire.apk
